# Hält das kostenlose Supabase-Projekt wach.
# Supabase pausiert kostenlose Projekte nach 7 Tagen ohne Zugriff. Dieser Ablauf fragt die Datenbank
# alle paar Tage kurz ab (wie die App beim Prüfen eines Einladungscodes) – es werden keine Daten verändert.
# Adresse und öffentlicher Schlüssel kommen aus public/config.js, es sind keine Geheimnisse nötig.
# Schlägt die Abfrage fehl (z. B. Projekt schon pausiert), schickt GitHub eine E-Mail.
name: Supabase wach halten

on:
  schedule:
    - cron: '17 6 */3 * *'   # alle 3 Tage um 06:17 UTC
  workflow_dispatch:          # zum Testen: „Actions“ → „Supabase wach halten“ → „Run workflow“

permissions:
  contents: read
  actions: write   # nur für den letzten Schritt (Zeitplan aktiv halten)

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Datenbank kurz abfragen
        run: |
          URL=$(grep -oP "supabaseUrl:\s*'\K[^']+" public/config.js || true)
          KEY=$(grep -oP "supabaseKey:\s*'\K[^']+" public/config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "In public/config.js ist kein Supabase-Projekt eingetragen – nichts zu tun."
            exit 0
          fi
          for attempt in 1 2 3; do
            code=$(curl -s -m 30 -o response.txt -w '%{http_code}' -X POST "$URL/rest/v1/rpc/check_invite" \
              -H "apikey: $KEY" -H "Content-Type: application/json" -d '{"p_code":"WACHHALT"}' || echo 000)
            echo "Versuch $attempt: HTTP $code – $(cat response.txt 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          echo "::error::Supabase antwortet nicht. Ist das Projekt pausiert? Im Supabase-Dashboard auf „Restore project“ klicken."
          exit 1

      - name: Zeitplan aktiv halten
        # GitHub schaltet Zeitpläne in öffentlichen Repositories nach 60 Tagen ohne Änderungen ab.
        # Das erneute Einschalten bei jedem Lauf setzt diese Frist zurück.
        if: always()
        run: |
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
